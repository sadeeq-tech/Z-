<!DOCTYPE html>
<html></html><head><meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>z+ Complete</title><style>:root{--bg:#05050a;--surf:#0b0b12;--input:#12121f;--accent:#00ffcc;--border:#1e1e2f}*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}body{background:var(--bg);color:#fff;display:flex;height:100vh}.side{width:240px;background:var(--surf);border-right:1px solid var(--border);padding:20px}.logo{font-size:32px;font-weight:900;color:var(--accent);margin-bottom:30px}.nav{padding:12px;border-radius:10px;cursor:pointer;margin-bottom:8px;color:#888}.nav.active{background:#161624;color:var(--accent)}.main{flex:1;position:relative}.panel{position:absolute;inset:0;display:none;overflow-y:auto}.panel.active{display:flex}#auth{justify-content:center;align-items:center}.box{background:var(--surf);padding:30px;border-radius:16px;border:1px solid var(--border);width:400px}.box input{width:100%;padding:12px;margin-bottom:12px;background:var(--input);border:1px solid var(--border);border-radius:8px;color:#fff}.btn{width:100%;padding:12px;background:linear-gradient(135deg,#00ffcc,#0077ff);border:none;border-radius:8px;font-weight:800;cursor:pointer}#reels{justify-content:center;background:#000}.reels{width:430px;height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}.reels::-webkit-scrollbar{display:none}.reel{height:100vh;scroll-snap-align:start;position:relative}.reel video{width:100%;height:100%;object-fit:cover}.info{position:absolute;bottom:0;left:0;right:0;padding:20px;background:linear-gradient(to top,rgba(0,0,0,.9),transparent)}.action{display:flex;gap:10px;margin-top:10px}.action button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 14px;border-radius:20px;cursor:pointer}.upload{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surf);border:1px solid var(--border);padding:12px 20px;border-radius:20px;display:flex;flex-direction:column;gap:8px;width:90%;max-width:420px;z-index:10}</style></head><body>
<aside class="side"><div class="logo">z+</div><div class="nav active" onclick="show('auth')">👤 Auth</div><div class="nav" onclick="show('reels')">▶️ Reels</div><div class="nav" onclick="logout()">🚪 Logout</div><div style="margin-top:30px;font-size:11px;color:#555">z+ V6 FINAL<br>SQLite + Upload + Like<br>Built in Katsina</div></aside>
<div class="main">
<section id="auth" class="panel active"><div class="box"><h2 id="title">Login</h2><br><input id="u" placeholder="Username (signup only)" style="display:none"><input id="e" placeholder="Email / Phone / Username"><input id="p" type="password" placeholder="Password"><button class="btn" id="b" onclick="login()">Login</button><p style="text-align:center;margin-top:12px;color:#888;font-size:14px">No account? <span style="color:var(--accent);cursor:pointer" onclick="toggle()">Signup</span></p><p id="err" style="color:#f55;text-align:center;margin-top:10px"></p></div></section>
<section id="reels" class="panel"><div class="reels" id="feed"></div><div class="upload"><div style="display:flex;gap:10px"><input type="file" id="file" accept="video/*" style="flex:1"><button class="btn" style="width:auto;padding:8px 16px" onclick="upload()">📤 Upload</button></div><input id="desc" placeholder="Description..."><div id="prog" style="display:none;color:var(--accent);font-size:12px">Uploading...</div></div></section>
</div>
<script>
const API='http://localhost:8080/api';let isLogin=true;
function show(n){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById(n).classList.add('active');if(n==='reels')load();}
function toggle(){isLogin=!isLogin;title.innerText=isLogin?'Login':'Signup';b.innerText=isLogin?'Login':'Create';b.setAttribute('onclick',isLogin?'login()':'signup()');u.style.display=isLogin?'none':'block';}
async function signup(){let r=await fetch(`${API}/auth/signup`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,email:e.value.includes('@')?e.value:'',phone:e.value.startsWith('+')?e.value:'',password:p.value})});let d=await r.json();if(r.ok){localStorage.setItem('username',d.username);localStorage.setItem('token',d.token);show('reels');}else err.innerText=d.error;}
async function login(){let r=await fetch(`${API}/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:e.value,password:p.value})});let d=await r.json();if(r.ok){localStorage.setItem('username',d.username);localStorage.setItem('token',d.token);show('reels');}else err.innerText=d.error;}
async function load(){let r=await fetch(`${API}/reels/feed`);let d=await r.json();let f=document.getElementById('feed');f.innerHTML='';d.feed.forEach(v=>{f.innerHTML+=`<div class="reel"><video autoplay loop muted playsinline src="${v.videoUrl}" onclick="this.paused?this.play():this.pause()"></video><div class="info"><div style="color:var(--accent);font-weight:700">${v.creator}</div><div>${v.description}</div><div class="action"><button onclick="like(${v.id})">❤️ ${v.likes}</button><button onclick="comment(${v.id})">💬 Comment</button></div></div></div>`});}
async function upload(){let file=document.getElementById('file').files[0];if(!file){alert('Zabi video!');return;}let fd=new FormData();fd.append('video',file);fd.append('creator',localStorage.getItem('username')||'@anon');fd.append('description',desc.value||'New reel');prog.style.display='block';prog.innerText='Uploading '+file.name+'...';let r=await fetch(`${API}/upload`,{method:'POST',body:fd});if(r.ok){alert('Uploaded 🔥');desc.value='';file.value='';prog.style.display='none';load();}else{alert('Failed');}}
async function like(id){let username=localStorage.getItem('username')||'guest';await fetch(`${API}/reels/${id}/like`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username})});load();}
async function comment(id){let text=prompt('Comment:');if(!text)return;await fetch(`${API}/reels/${id}/comment`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:localStorage.getItem('username')||'guest',text})});alert('Added!');}
function logout(){localStorage.clear();location.reload();}toggle();toggle();
</script></body></html>
